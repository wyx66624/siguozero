# 共享训练配置：同时定义 bootstrap/main/extended 三档；实际档位必须由
# --model-scale 明确选择。正式启动脚本选 main，直接使用 Python CLI 默认 bootstrap。
schema_version: 1
config_revision: 24
experiment_name: siguozero_v24_draw_penalty_countdown

rules:
  game_modes:
    - two_player
    - four_player
  information_modes:
    two_player:
      - dark
    four_player:
      - four_dark
      - double_open
  # full_open/open 规则引擎可使用下方精确身份码，但不属于当前训练入口。
  intermediate_reward: 0
  terminal_reward:
    win: 1
    draw: -0.15
    loss: -1
  gamma: 1.0
  no_capture_draw_plies: 70
  max_passes_per_player: 4

board_piece_codes:
  # 类别 ID 按点位顺序展开为整盘 one-hot 向量，不解释为连续军阶标量。
  empty: 0
  unknown_previous_player: 1
  unknown_opposite_player: 2
  unknown_next_player: 3
  own:
    flag: 30
    bomb: 31
    engineer: 32
    platoon_commander: 33
    company_commander: 34
    battalion_commander: 35
    regiment_commander: 36
    brigade_commander: 37
    division_commander: 38
    army_commander: 39
    commander: 40
    mine: 41
  # 已确定身份采用无碰撞座位分块：exact = own_code + 32 * block。
  # 四国 block=0/1/2/3 分别为我方/上家/对家/下家；二人敌方用对家 block=2。
  exact_identity_stride: 32
  known_previous_player:
    flag: 62
    bomb: 63
    engineer: 64
    platoon_commander: 65
    company_commander: 66
    battalion_commander: 67
    regiment_commander: 68
    brigade_commander: 69
    division_commander: 70
    army_commander: 71
    commander: 72
    mine: 73
  known_opposite_player:
    flag: 94
    bomb: 95
    engineer: 96
    platoon_commander: 97
    company_commander: 98
    battalion_commander: 99
    regiment_commander: 100
    brigade_commander: 101
    division_commander: 102
    army_commander: 103
    commander: 104
    mine: 105
  known_next_player:
    flag: 126
    bomb: 127
    engineer: 128
    platoon_commander: 129
    company_commander: 130
    battalion_commander: 131
    regiment_commander: 132
    brigade_commander: 133
    division_commander: 134
    army_commander: 135
    commander: 136
    mine: 137
  padding: 138
  vocabulary_size: 139
  persistent_exact_inference:
    # 总开关也可由 CLI --dead-rules / --no-dead-rules 覆盖。
    # 关闭时不做下列持久确定性标注。
    method: enumerate_viewer_legal_combat_pairs_and_commit_only_unanimous_types
    commander_death_reveals_flag: true
    surviving_attacker_over_known_army_commander_is_commander: true
    surviving_attacker_over_known_division_after_own_flag_reveal_is_army_commander: true
    railway_turn_proves_engineer: true
    surviving_defender_over_known_commander_is_mine: true
    engineer_survives_attack_means_defender_was_mine: true
    single_flag_reveal_in_mutual_removal_means_commander_vs_bomb: true
    two_flag_reveals_in_mutual_removal_mean_commander_vs_commander: true
    unmoved_first_row_excludes_bomb_for_equal_rank_exchange: true
    exhausted_exact_inventory_prunes_future_candidates: true
    use_referee_hidden_identity_to_infer: false
  exact_casualty_prior:
    # 仅在 runtime.dead_rules_enabled=true 时存在；关闭后模型结构中也没有
    # 整盘投影中的 75 个输入列，而不是简单地输入全零向量。
    slots_per_player: 25
    slot_order: same_as_models.layout.piece_sequence
    values: binary_exactly_known_dead
    four_dark_relative_players: [1, 2, 3]
    double_open_relative_players: [1, 3]
    two_player_relative_players: [1]
    double_open_share_between_self_and_opposite_ally: true
    flag_capture_or_elimination_sets_all_25: true
    include_probabilistic_or_nonunique_inference: false

models:
  common:
    # 一个训练模式只启动一套玩家网络；四个座位共享同一 Policy/Layout 权重。
    player_parameter_sharing: single_policy_and_layout_instance_all_seats
    action_embedding_dim: 256
    board_embedding_dim: 256
    transition_token_dim: 512
    dropout: 0.0

  # Applied to four_dark/double_open after selecting bootstrap/main/extended.
  # Layer counts, layout capacity and history length retain the selected scale.
  # The base profile below remains available for existing two-player models.
  four_player:
    action_embedding_dim: 128
    board_embedding_dim: 128
    transition_token_dim: 256
    temporal_ffn_dim: 1024

  layout:
    architecture: piece_conditioned_autoregressive_pointer_decoder
    d_model: 256
    attention_heads: 8
    ffn_dim: 1024
    transformer_layers: 8
    deployment_steps: 25
    pointer_position_count: 25
    point_order: row_major_non_camp
    partial_layout_attention: bidirectional
    pooling: layout_token
    piece_sequence:
      - flag
      - mine
      - mine
      - mine
      - bomb
      - bomb
      - commander
      - army_commander
      - division_commander
      - division_commander
      - brigade_commander
      - brigade_commander
      - regiment_commander
      - regiment_commander
      - battalion_commander
      - battalion_commander
      - company_commander
      - company_commander
      - company_commander
      - platoon_commander
      - platoon_commander
      - platoon_commander
      - engineer
      - engineer
      - engineer
    pointer_query_fields:
      - current_piece
      - deployment_step
      - game_mode
      - pooled_partial_layout
    pointer_key_value_source: partial_layout_point_states
    output: position_logits
    exact_inventory_by_fixed_piece_sequence: true
    hard_mask:
      empty_position: true
      piece_rule: true
      future_feasibility: false
    temperature: 0.7
    action_selection: categorical
    sample_from_distribution: true
    greedy_argmax: false
    final_player_setup_validation: true

  policy:
    architecture: board_encoder_plus_causal_transition_transformer
    action_encoder:
      architecture: coordinates_player_linear
      input_dim: 6
      output_dim: 256
      coordinate_system: viewer_relative_board_wide_cartesian
      normalization: none
      linear_layers: 1
      learned_field_embeddings: false
      layer_norm: false
      fields:
        - source_x
        - source_y
        - destination_x
        - destination_y
        - actor
        - remaining_no_capture_plies
    board_encoder:
      architecture: whole_board_one_hot_linear
      input: player_visible_integer_chain_plus_optional_exact_casualty_prior
      vector_encoding: position_major_categorical_one_hot_then_mode_and_optional_casualties
      board_point_capacity: 129
      board_code_categories: 139
      mode_categories: 3
      canonical_casualty_input_dim_when_dead_rules_enabled: 75
      disabled_behavior: omit_casualty_tensor_and_projection_input_columns
      input_dim_with_dead_rules: 18009
      input_dim_without_dead_rules: 17934
      output_dim: 256
      linear_layers: 1
      preserve_point_representations_for_action_heads: false
    temporal_transformer:
      token_construction: concat_action_then_post_action_board
      initial_action_padding: zeros_256
      d_model: 512
      transformer_layers: 8
      attention_heads: 8
      ffn_dim: 1024
      causal: true
    action_factorization:
      - source
      - destination_given_source
    action_head: context_to_position_logits_with_one_hot_source_conditioning
    value_head: false
    belief_head: false
    sample_from_distribution: true

history:
  # T0 永久保留，另保留最近最多 1000 个“动作 + 动作后棋盘”转移 token。
  training_mode: sliding_window
  pin_initial_state_token: true
  max_previous_decisions: 1000
  max_sequence_tokens: 1001
  position_capacity: 1024
  board_snapshot_after_every_action: true
  store_raw_board_integer_chain: true
  recompute_board_embedding_in_learner: true
  debug_recent_decisions: 256

# Terminal branching below is used by two-player GRPO. Four-player PPO uses
# the ppo section and never consumes these candidate/replica counts.
rollout:
  parallel_environments_min: 256
  rollout_to_terminal: true
  simulate_every_base_trajectory_decision: true
  # 从 masked 冻结旧策略独立有放回采样 4 个候选槽；不穷举、也不强制去重。
  enumerate_all_legal_root_actions: false
  root_candidate_selection: iid_categorical_old_policy_with_replacement
  root_candidate_count: 4
  allow_duplicate_root_candidates: true
  environment_replicas_per_root_candidate: 2
  terminal_simulations_per_anchor: 8
  suffix_action_selection: sample_old_policy_categorical
  suffix_temperature: 1.0
  greedy_suffix: false
  recursive_full_tree_expansion: false
  # 目标批 128 个锚点；96～256 个锚点对应 768～2,048 条终局续局。
  completed_terminal_simulations_per_update_target: 1024
  completed_terminal_simulations_per_update_min: 768
  completed_terminal_simulations_per_update_max: 2048
  keep_anchor_groups_atomic: true
  keep_root_candidate_replica_groups_atomic: true
  environment_steps_per_update: variable_until_all_branches_terminal

# Four-player move policies use PPO; two-player and the separate deployment
# policy retain their terminal-return updates. No PPO move spawns replicas.
ppo:
  discount: 1.0
  gae_lambda: 0.95
  value_coefficient: 0.5
  value_clip_epsilon: 0.2
  critic_learning_rate: 1.0e-4
  critic_epochs: 3
  # Reuse exact causal prefixes and supervise every collected decision.
  sequence_training: true
  max_samples_per_sequence: 64
  # Samples per optimizer step per rank; distinct from the rollout buffer.
  optimizer_minibatch_samples: 512
  # Independent game groups overlap CPU rules with the next group's Policy.
  environment_workers: 4
  pipeline_groups: 2
  deferred_values: true
  tensor_learner: true
  varlen_attention: true
  low_precision_residual: true
  fused_optimizer: true
  sampling_graphs: true
  # Dynamic training CUDA Graph capture was slower / exceeded safe VRAM.
  compile_mode: default
  # Same 512 supervised decisions / Adam step; only sequence microbatch changes.
  learner_microbatch_by_model_scale:
    main: 32
  causal_sdpa: true
  board_chunk_size: 2048
  layout_prefetch_games: 16
  activation_checkpointing: false
  transition_batch: 12288
  # Total TRAINING environment transitions across games, seats and ranks:
  # base-game actions + every actually executed simulated-branch action.
  # E.g. 8 branches x 32 actions = 256 steps; a separate base action adds 1.
  # Network forward/backward, value bootstrap and repeated epochs add 0 steps.
  # total_updates is derived from this target unless --updates is explicit.
  target_environment_plies: 3000000000
  # 4090 compact four-player model: 256 actions/game/update, 32 learner sequences.
  # The launch script multiplies global games/transitions by NUM_GPUS.
  base_game_pool_size: 48
  actor_inference_batch: 48
  # PPO 观察按数值块存储；固定游戏/席位 KV，一次补齐已发生的多个 token。
  array_history: true
  fixed_kv: true
  cuda_graphs: true
  # 兼容旧分支缓存的后备容量；fixed_kv 使用 4 seats x live games 个槽。
  inference_temporal_cache_entries: 576
  # Historical four-player estimate, used only by --grpo-equivalent-plies.
  grpo_mean_remaining_plies: 334.5

grpo:
  strategy_grouping: sampled_root_candidate_slots
  root_candidate_count: 4
  terminal_replicas_per_candidate: 2
  average_replicas_before_group_normalization: true
  group_normalization_candidate_slots: 4
  candidates_already_sampled_from_old_policy: true
  policy_weighted_action_baseline: false
  layout_group_size_initial: 8
  advantage_epsilon: 1.0e-4
  skip_policy_term_when_group_std_below: 1.0e-4

learner:
  optimizer: adamw
  # 下方为 GRPO 锚点 batch；四国由 ppo.transition_batch 覆盖为真实动作数。
  policy_batch:
    unit: anchor_state_group
    global_target: 128
    global_minimum: 96
    global_maximum: 256
    sampled_root_candidate_returns_at_target: 512
    terminal_continuations_at_target: 1024
    per_device_microbatch_start:
      rtx_4090_24gb:
        bootstrap: 16
        main: 8
        extended: 6
      h100_80gb:
        bootstrap: 64
        main: 32
        extended: 24
      h200_141gb:
        bootstrap: 128
        main: 64
        extended: 48
      # 910B 64GB 的保守起测值；以 tools/benchmark_cuda.py --device npu
      # 实测后再提高，脚本中的 MICROBATCH 环境变量可直接覆盖。
      ascend_910b_64gb:
        bootstrap: 16
        main: 8
        extended: 4
    gradient_accumulation: auto_to_global_target
  # 25-token Pointer 布局序列可以使用原图中的 1024 全局 batch。
  layout_global_batch_size: 1024
  max_epochs_per_batch: 3
  clip_epsilon: 0.2
  learning_rate:
    initial: 1.0e-4
    adaptive: true
    minimum: 1.0e-6
  gradient_norm_clip: 1.0
  entropy_coefficient:
    initial: 0.01
    minimum: 0.005
    maximum: 0.02
    adaptive_to_target_entropy: true
    target_ratio: 0.6
    adaptation_rate: 0.1
    ema_decay: 0.9
    opening_plies: 16
  kl:
    initial_coefficient: 0.02
    target_per_action: 0.015
  early_stop:
    observed_kl_multiple: 1.5
    clipped_sample_fraction: 0.30
  precision:
    model: bfloat16
    loss_and_reductions: float32

model_selection:
  # 二人保留百分比日程；四暗、双明从初始基准起每 5000 万训练环境交互选拔。
  # games 是全体 rank 合计局数；二人按 2 局换边、四国按 4 局整队轮转分组。
  enabled: true
  checkpoint_policy: periodic
  start_percent: 30
  interval_percent: 5
  games: 1000
  four_player:
    interval_environment_plies: 50000000
    games: 100
    # 完整续训断点每 2500 万环境步保存；评测仍为每 5000 万步。
    checkpoint_policy: periodic
    checkpoint_interval_environment_plies: 25000000
  max_plies: null
  seed: 20260910
  temporal_cache_entries: 8
  # 每个 rank 的并发局数、单次推理上限与 CPU 环境 worker 数。
  # 新旧两个版本共享各自权重；并发不会增加全局评测总局数。
  parallel_games: 32
  inference_batch_size: 32
  environment_workers: 4

staleness:
  maximum_behavior_policy_versions: 1
  store_source_and_destination_log_probs: true
  store_layout_position_log_probs: true

runtime:
  # CLI 可用 --dead-rules/--no-dead-rules 覆盖。两种模型架构互不兼容。
  dead_rules_enabled: true
  # 最终路径为 <output_root>/<mode>/with_dead_rules 或
  # <output_root>/<mode>/without_dead_rules；自定义 --run-dir 也会追加该层。
  output_root: runs
  total_updates: 200000
  # 二人 null 表示只受 total_updates 限制；可通过 CLI 指定 GRPO 分支步数。
  # 四国由 ppo.target_environment_plies 覆盖，统计训练采样与模拟分支的总交互。
  target_environment_plies: null
  # 兼容旧二人 GRPO 的仅分支预算；总交互预算用上面的字段/CLI 入口。
  target_continuation_plies: null
  seed: 20260902
  device: auto
  amp: bfloat16
  enable_tf32: true
  enable_torch_compile: false
  # 冻结 rollout 阶段在每个 rank/GPU 上缓存历史棋盘的 256 维全局向量。
  # 只缓存 detached 推理结果，进入 learner 前清空；0 表示关闭。
  inference_board_cache_entries: 65536
  # rollout 使用逐 token causal KV；缓存条目是状态前缀而不是玩家模型副本。
  # 8 个锚点一波对应最多 64 条分支，384 条 LRU 可覆盖两位玩家的
  # 活跃前缀并留出写时追加空间；128 会发生抖动，实测 192 已无冷重算。
  incremental_inference: true
  # CUDA/NPU rollout 默认使用项目内页式 COW KV + PyTorch 2.7 SDPA，
  # 避免每 token/层 cat 整段历史。
  # learner 仍走普通全序列 attention；CLI --no-paged-kv 可做严格 A/B。
  paged_kv_cache: true
  # 页式 KV 允许不同历史长度共用一次带 mask 的 SDPA。1001 覆盖完整历史窗，
  # 避免长期训练后退化成大量 8-row 小批次；真实 checkpoint A/B 快于窄桶。
  paged_kv_length_bucket_tokens: 1001
  inference_temporal_cache_entries: 192
  base_game_pool_size:
    four_dark: 32
    double_open: 32
    two_player: 64
  max_game_plies: null
  # 1001-token BF16 实测安全起点；CLI --microbatch 可按本机复测覆盖。
  policy_microbatch:
    bootstrap: 16
    main: 8
    extended: 6
  actor_inference_batch: 64
  rollout_anchor_wave_size: 8
  # 加速器推理下一块时，由线程推进上一块独立规则环境；CPU-only 测试退化为串行。
  rollout_environment_workers: 2
  learner_length_bucketing: true
  policy_epochs: 3
  layout_update_interval: 8
  layout_outcomes_per_update: 64
  layout_learning_rate: 5.0e-5
  warmup_updates: 2000
  reference_refresh_updates: 50000
  checkpoint_every_updates: 5
  archive_every_updates: 500
  keep_checkpoint_archives: 10
  metrics_every_updates: 1
  # 与 update 日志独立，即使一轮 rollout 很长也持续记录显存、利用率、温度、
  # 功耗和磁盘空间。单卡 OOM 会从指定 microbatch 逐级减半；多卡为避免 rank
  # collective 失配会快速退出，应从最后检查点以更小 --microbatch 重启。
  resource_monitor_interval_seconds: 30
  auto_reduce_microbatch_on_oom: true
  minimum_policy_microbatch: 1

scale_gate:
  # 通过规则、信息隔离、吞吐和首轮棋力验收后，扩展到文档中的主训练版。
  bootstrap_anchor_states: 1000000
  bootstrap_completed_terminal_simulations: 8000000
  bootstrap_learner_updates_approx: 7813
  bootstrap_branch_environment_plies_approx: 2068000000
  next_layout_layers: 16
  next_policy_board_encoder_layers: 8
  next_policy_temporal_layers: 32
  next_policy_temporal_d_model: 512
  next_policy_temporal_ffn_dim: 2048

compute_budget:
  # 由当前 Python 规则引擎的随机策略样本估算；生产中使用滚动实测值替换。
  random_baseline:
    two_player_games: 100
    two_player_mean_plies: 327.3
    two_player_mean_legal_actions: 30.3
    four_player_games: 60
    four_player_mean_plies: 610.6
    four_player_mean_legal_actions: 42.5
  training_targets:
    competitive_anchor_states: 8000000
    competitive_completed_terminal_simulations: 64000000
    competitive_branch_environment_plies_approx: 16544000000
    competitive_learner_updates_approx: 62500
    champion_anchor_states_min: 25600000
    champion_anchor_states_max: 76800000
    champion_completed_terminal_simulations_min: 204800000
    champion_completed_terminal_simulations_max: 614400000
    champion_branch_environment_plies_min_approx: 52940000000
    champion_branch_environment_plies_max_approx: 158800000000
    champion_learner_updates_min: 200000
    champion_learner_updates_max: 600000
  base_game_diversity_per_update:
    bootstrap_min: 32
    main_min: 64
  actor_requirements:
    use_kv_cache: implemented_contiguous_sdpa_incremental
    share_branch_prefix_copy_on_write: implemented_persistent_history_and_bounded_prefix_lru
    update_every_observer_view: true
  memory_optimizations:
    bfloat16: true
    fused_scaled_dot_product_attention: true
    activation_checkpointing: true
    board_history_time_chunking: true
    deduplicate_overlapping_board_snapshots_per_update: true
    packed_board_rows: true
    learner_history_length_bucketing: true
    rollout_anchor_wave_size: 8
    temporal_prefix_cache_entries_per_rank: 192
