  layout_microbatch_size: 32
  layout_learning_rate: 5.0e-05
  warmup_updates: 250
  reference_refresh_updates: 6250
  checkpoint_every_updates: 5
  archive_every_updates: 1
  # Model versions are all retained; keep a bounded set of full optimizer/game-pool states.
  keep_checkpoint_archives: 3
  metrics_every_updates: 1
  # Observational only: rotated CPU lanes, exact replay segments and real personal GAE.
  tactical_logging:
