# Expanded four-player MAPPO: private actor, full-information scalar critic.
# Single RTX 4090 training profile; measured launch evidence is kept under output/diagnostics.
# Start a new run with --model-scale main; do not resume the 256-wide PPO run.
schema_version: 1
config_revision: 25
experiment_name: siguozero_expand_mappo
rules:
  game_modes:
  - two_player
  - four_player
  information_modes:
    two_player:
    - dark
    four_player:
    - four_dark
    - double_open
  intermediate_reward: 0
  terminal_reward:
    win: 1
    draw: -0.15
    loss: -1
  gamma: 1.0
  no_capture_draw_plies: 70
  max_passes_per_player: 4
board_piece_codes:
  empty: 0
  unknown_previous_player: 1
  unknown_opposite_player: 2
  unknown_next_player: 3
  own:
    flag: 30
    bomb: 31
    engineer: 32
    platoon_commander: 33
    company_commander: 34
    battalion_commander: 35
    regiment_commander: 36
    brigade_commander: 37
    division_commander: 38
    army_commander: 39
    commander: 40
    mine: 41
  exact_identity_stride: 32
  known_previous_player:
    flag: 62
    bomb: 63
    engineer: 64
    platoon_commander: 65
    company_commander: 66
    battalion_commander: 67
    regiment_commander: 68
    brigade_commander: 69
    division_commander: 70
    army_commander: 71
    commander: 72
    mine: 73
  known_opposite_player:
    flag: 94
    bomb: 95
    engineer: 96
    platoon_commander: 97
    company_commander: 98
    battalion_commander: 99
    regiment_commander: 100
    brigade_commander: 101
    division_commander: 102
    army_commander: 103
    commander: 104
    mine: 105
  known_next_player:
    flag: 126
    bomb: 127
    engineer: 128
    platoon_commander: 129
    company_commander: 130
    battalion_commander: 131
    regiment_commander: 132
    brigade_commander: 133
    division_commander: 134
    army_commander: 135
    commander: 136
    mine: 137
  padding: 138
  vocabulary_size: 139
  persistent_exact_inference:
    method: enumerate_viewer_legal_combat_pairs_and_commit_only_unanimous_types
    commander_death_reveals_flag: true
    surviving_attacker_over_known_army_commander_is_commander: true
    surviving_attacker_over_known_division_after_own_flag_reveal_is_army_commander: true
    railway_turn_proves_engineer: true
    surviving_defender_over_known_commander_is_mine: true
    engineer_survives_attack_means_defender_was_mine: true
    single_flag_reveal_in_mutual_removal_means_commander_vs_bomb: true
    two_flag_reveals_in_mutual_removal_mean_commander_vs_commander: true
    unmoved_first_row_excludes_bomb_for_equal_rank_exchange: true
    exhausted_exact_inventory_prunes_future_candidates: true
    use_referee_hidden_identity_to_infer: false
  exact_casualty_prior:
    slots_per_player: 25
    slot_order: same_as_models.layout.piece_sequence
    values: binary_exactly_known_dead
    four_dark_relative_players:
    - 1
    - 2
    - 3
    double_open_relative_players:
    - 1
    - 3
    two_player_relative_players:
    - 1
    double_open_share_between_self_and_opposite_ally: true
    flag_capture_or_elimination_sets_all_25: true
    include_probabilistic_or_nonunique_inference: false
models:
  # Legacy/two-player base profile; four_player below overrides these input dimensions.
  common:
    player_parameter_sharing: single_policy_and_layout_instance_all_seats
    action_embedding_dim: 256
    board_embedding_dim: 256
    transition_token_dim: 512
    dropout: 0.0
  four_player:
    action_embedding_dim: 128
    # 4 coordinates + previous actor + draw countdown + 4 relative alive bits.
    # No separate countdown/alive/revealed-flag embedding in this profile.
    action_encoder_type: coordinates_player_countdown_active_linear
    board_embedding_dim: 384
    board_encoder_type: whole_board_inventory_multihot_linear
    # 129 * (25 interchangeable inventory slots + 1 relative owner), plus
    # the existing 3 mode + 75 exact casualty + 4 pass features: 3436 -> 384.
    transition_token_dim: 512
    token_fusion_hidden_dim: 512
    temporal_layers: 16
    attention_heads: 8  # 512 / 8 = 64 dimensions per head.
    temporal_ffn_dim: 1024
  layout:
    architecture: piece_conditioned_autoregressive_pointer_decoder
    d_model: 256
    attention_heads: 8
    ffn_dim: 1024
    transformer_layers: 8
    deployment_steps: 25
    pointer_position_count: 25
    point_order: row_major_non_camp
    partial_layout_attention: bidirectional
    pooling: layout_token
    piece_sequence:
    - flag
    - mine
    - mine
    - mine
    - bomb
    - bomb
    - commander
    - army_commander
    - division_commander
    - division_commander
    - brigade_commander
    - brigade_commander
    - regiment_commander
    - regiment_commander
    - battalion_commander
    - battalion_commander
    - company_commander
    - company_commander
    - company_commander
    - platoon_commander
    - platoon_commander
    - platoon_commander
    - engineer
    - engineer
    - engineer
    pointer_query_fields:
    - current_piece
    - deployment_step
    - game_mode
    - pooled_partial_layout
    pointer_key_value_source: partial_layout_point_states
    output: position_logits
    exact_inventory_by_fixed_piece_sequence: true
    hard_mask:
      empty_position: true
      piece_rule: true
      future_feasibility: false
    temperature: 0.7
    action_selection: categorical
    sample_from_distribution: true
    greedy_argmax: false
    final_player_setup_validation: true
  policy:
    architecture: board_encoder_plus_causal_transition_transformer
    action_encoder:
      architecture: coordinates_player_linear
      input_dim: 6
      output_dim: 256
      coordinate_system: viewer_relative_board_wide_cartesian
      normalization: none
      linear_layers: 1
      learned_field_embeddings: false
      layer_norm: false
      fields:
      - source_x
      - source_y
      - destination_x
      - destination_y
      - actor
      - remaining_no_capture_plies
    board_encoder:
      architecture: whole_board_inventory_multihot_linear
      input: player_visible_inventory_candidates_and_relative_owner
      vector_encoding: position_major_25_slot_multihot_plus_owner_then_mode_casualties_and_passes
      board_point_capacity: 129
      candidate_slots_per_point: 25
      relative_owner_features_per_point: 1
      mode_categories: 3
      canonical_casualty_input_dim_when_dead_rules_enabled: 75
      requires_dead_rules: true
      input_dim_with_dead_rules: 3436
      output_dim: 256
      linear_layers: 1
      preserve_point_representations_for_action_heads: false
    temporal_transformer:
      token_construction: concat_action_then_post_action_board
      initial_action_padding: zeros_256
      d_model: 512
      transformer_layers: 8
      attention_heads: 8
      ffn_dim: 1024
      causal: true
    action_factorization:
    - source
    - destination_given_source
    action_head: context_to_position_logits_with_one_hot_source_conditioning
    value_head: false
    belief_head: false
    sample_from_distribution: true
history:
  training_mode: sliding_window
  pin_initial_state_token: true
  max_previous_decisions: 1000
  max_sequence_tokens: 1001
  position_capacity: 1024
  board_snapshot_after_every_action: true
  store_raw_board_integer_chain: true
  recompute_board_embedding_in_learner: true
  debug_recent_decisions: 256
rollout:
  parallel_environments_min: 256
  rollout_to_terminal: true
  simulate_every_base_trajectory_decision: true
  enumerate_all_legal_root_actions: false
  root_candidate_selection: iid_categorical_old_policy_with_replacement
  root_candidate_count: 4
  allow_duplicate_root_candidates: true
  environment_replicas_per_root_candidate: 2
  terminal_simulations_per_anchor: 8
  suffix_action_selection: sample_old_policy_categorical
  suffix_temperature: 1.0
  greedy_suffix: false
  recursive_full_tree_expansion: false
  completed_terminal_simulations_per_update_target: 1024
  completed_terminal_simulations_per_update_min: 768
  completed_terminal_simulations_per_update_max: 2048
  keep_anchor_groups_atomic: true
  keep_root_candidate_replica_groups_atomic: true
  environment_steps_per_update: variable_until_all_branches_terminal
ppo:
  algorithm: mappo
  critic_layers: 16
  discount: 1.0
  gae_lambda: 0.95
  # Each captured flag: +0.2 for the capturing team, -0.2 for the losing team.
  # Added to any terminal reward on the same step; zero disables event shaping.
  flag_capture_reward: 0.2
  # Actual bomb casualties, credited once to the bomb's team (attack or defense).
  # Linear decay in global environment steps; zero from half the step budget.
  bomb_commander_reward: 0.03
  bomb_army_commander_reward: 0.01
  bomb_division_commander_reward: 0.003
  # Temporary public-evidence shaping; reaches zero at half the global step budget.
  futile_attack_penalty: 0.01
  futile_attack_ema_decay: 0.95
  value_coefficient: 0.5
  value_clip_epsilon: 0.2
  critic_learning_rate: 0.0001
  critic_epochs: 3
  sequence_training: true
  max_samples_per_sequence: 256
  optimizer_minibatch_samples: 512
  environment_workers: 16
  learner_microbatch_by_model_scale:
    main: 32
  causal_sdpa: true
  board_chunk_size: 2048
  layout_prefetch_games: 16
  activation_checkpointing: false
  transition_batch: 98304
  target_environment_plies: 3000000000
  base_game_pool_size: 128
  actor_inference_batch: 128
  array_history: true
  fixed_kv: true
  cuda_graphs: true
  inference_temporal_cache_entries: 576
  grpo_mean_remaining_plies: 334.5
  tensor_learner: true
  varlen_attention: true
  low_precision_residual: true
  sampling_graphs: true
  compile_mode: default
  deferred_values: true
  pipeline_groups: 2
  fused_optimizer: true
  # Two bounded learner shapes share scratch memory; optimizer/finite guard stay eager.
  learner_cuda_graphs: true
  cuda_memory_fraction: 0.90
  adaptive_clip:
    enabled: true
    absolute_advantage: true
    unclipped_advantage_threshold: 2.0
    minimum: 0.10
    maximum: 0.45
    advantage_scale: 0.5
    # [fraction of environment-step budget, lower epsilon, upper baseline]
    # Linear interpolation; upper epsilon adds up to 50% for high advantage.
    schedule:
      - [0.0, 0.25, 0.30]
      - [0.3333333333333333, 0.20, 0.25]
      - [0.50, 0.18, 0.20]
      - [0.75, 0.15, 0.15]
      - [1.0, 0.10, 0.10]
grpo:
  strategy_grouping: sampled_root_candidate_slots
  root_candidate_count: 4
  terminal_replicas_per_candidate: 2
  average_replicas_before_group_normalization: true
  group_normalization_candidate_slots: 4
  candidates_already_sampled_from_old_policy: true
  policy_weighted_action_baseline: false
  layout_group_size_initial: 8
  advantage_epsilon: 0.0001
  skip_policy_term_when_group_std_below: 0.0001
learner:
  optimizer: adamw
  policy_batch:
    unit: anchor_state_group
    global_target: 128
    global_minimum: 96
    global_maximum: 256
    sampled_root_candidate_returns_at_target: 512
    terminal_continuations_at_target: 1024
    per_device_microbatch_start:
      rtx_4090_24gb:
        bootstrap: 16
        main: 8
        extended: 6
      h100_80gb:
        bootstrap: 64
        main: 32
        extended: 24
      h200_141gb:
        bootstrap: 128
        main: 64
        extended: 48
      ascend_910b_64gb:
        bootstrap: 16
        main: 8
        extended: 4
    gradient_accumulation: auto_to_global_target
  layout_global_batch_size: 1024
  max_epochs_per_batch: 3
  clip_epsilon: 0.2
  learning_rate:
    initial: 0.0001
    adaptive: true
    minimum: 5.0e-06
    maximum: 1.0e-04
    # Final probe mean controls LR; three consecutive out-of-band updates
    # move it 5%, followed by three observation-only updates. No cosine/warmup.
    increase_on_full_epochs: false
    kl_band_lower: 0.08
    kl_band_upper: 0.14
    increase_factor: 1.05
    decrease_factor: 0.95
    stable_updates: 3
    cooldown_updates: 3
    ema_decay: 0.8
    probe_samples: 8192
  gradient_norm_clip: 1.0
  entropy_coefficient:
    initial: 0.01
    minimum: 0.005
    maximum: 0.02
    opening_maximum: 0.04  # opening-only ceiling; resume the existing adaptive coefficient
    adaptive_to_target_entropy: true
    target_ratio: 0.6  # H / log(number of legal actions), excluding forced moves
    adaptation_rate: 0.1  # log-coefficient feedback once per completed update
    ema_decay: 0.9
    opening_plies: 16  # separate opening and later-play entropy controllers
    mode_overrides:
      four_dark:
        minimum: 0.001
        maximum: 0.01
        opening_maximum: 0.02
        target_ratio: 0.50
        opening_target_ratio: 0.50
        # [completed global environment steps, opening target, later-play target].
        # Hold 0.50 through 350M, then interpolate linearly; resume keeps progress.
        target_schedule:
          - [0, 0.50, 0.50]
          - [350000000, 0.50, 0.50]
          - [1500000000, 0.40, 0.40]
          - [3000000000, 0.35, 0.35]
  kl:
    initial_coefficient: 0.02
    target_per_action: 0.02
  early_stop:
    # KL-band mode checks the probe mean after each complete epoch against
    # kl_band_upper (0.14). The legacy minibatch limit below is inactive there.
    # Do not stop for ratio clipping alone.
    minimum_policy_epochs: 1
    observed_kl_multiple: 5.0
    clipped_sample_fraction: 1.0
  precision:
    model: bfloat16
    loss_and_reductions: float32
model_selection:
  enabled: true
  checkpoint_policy: periodic
  start_percent: 30
  interval_percent: 5
  games: 1000
  four_player:
    interval_environment_plies: 50000000
    after_half_interval_environment_plies: 50000000
    after_half_historical_only: false
    observational_only: false
    # Every evaluation challenges the incumbent champion, including after half.
    champion_only: true
    historical_teammate_fraction: 0.5
    games: 500
    checkpoint_policy: periodic
    checkpoint_interval_environment_plies: 10000000
  max_plies: null
  seed: 20260910
  temporal_cache_entries: 8
  parallel_games: 32
  inference_batch_size: 32
  environment_workers: 4
staleness:
  maximum_behavior_policy_versions: 1
  store_source_and_destination_log_probs: true
  store_layout_position_log_probs: true
runtime:
  dead_rules_enabled: true
  output_root: runs_expand_mappo
  total_updates: 200000
  target_environment_plies: null
  target_continuation_plies: null
  seed: 20260902
  device: auto
  amp: bfloat16
  enable_tf32: true
  enable_torch_compile: false
  inference_board_cache_entries: 65536
  incremental_inference: true
  paged_kv_cache: true
  paged_kv_length_bucket_tokens: 1001
  inference_temporal_cache_entries: 192
  base_game_pool_size:
    four_dark: 32
    double_open: 32
    two_player: 64
  max_game_plies: null
  policy_microbatch:
    bootstrap: 16
    main: 8
    extended: 6
  actor_inference_batch: 64
  rollout_anchor_wave_size: 8
  rollout_environment_workers: 2
  learner_length_bucketing: true
  policy_epochs: 3
  layout_update_interval: 1
  # Consume all available fresh outcomes up to this cap, with one Adam update.
  layout_outcomes_per_update: 2048
  layout_buffer_capacity: 8192
  layout_max_behavior_age: 8
  layout_microbatch_size: 32
  layout_learning_rate: 5.0e-05
  warmup_updates: 250
  reference_refresh_updates: 6250
  checkpoint_every_updates: 5
  archive_every_updates: 1
  # Model versions are all retained; keep a bounded set of full optimizer/game-pool states.
  keep_checkpoint_archives: 3
  metrics_every_updates: 1
  resource_monitor_interval_seconds: 15
  inference_snapshot_every_updates: 5
  auto_reduce_microbatch_on_oom: true
  minimum_policy_microbatch: 1
scale_gate:
  bootstrap_anchor_states: 1000000
  bootstrap_completed_terminal_simulations: 8000000
  bootstrap_learner_updates_approx: 7813
  bootstrap_branch_environment_plies_approx: 2068000000
  next_layout_layers: 16
  next_policy_board_encoder_layers: 8
  next_policy_temporal_layers: 16
  next_policy_temporal_d_model: 512
  next_policy_temporal_ffn_dim: 2048
historical_opponents:
  enabled: true
  start_fraction: 0.06666666666666667  # 200M of the 3B environment-step budget.
  training_fraction: 0.5
  teammate_fraction: 0.0
  snapshot_fractions: [0.016666666666666666, 0.03333333333333333, 0.05]
  # Every saved version from 50M remains eligible; cache limits never prune it.
  checkpoint_start_fraction: 0.016666666666666666
  sampling: strength
  initial_loss_rate: 0.5
  win_rate_temperature: 0.10  # Softmax of learner loss-rate EMA; draws excluded.
  win_rate_ema_alpha: 0.01
  stage_mix_fraction: 0.0
  cache_gib: 32
  cache_reserve_gib: 16
  pinned_mib: 256
  cohort_games: 1024
  eval_total_games: 500  # Total across the frozen panel, allocated in four-game rotations.
  uniform_fraction: 0.0
  learning_rate: 0.01

compute_budget:
  random_baseline:
    two_player_games: 100
    two_player_mean_plies: 327.3
    two_player_mean_legal_actions: 30.3
    four_player_games: 60
    four_player_mean_plies: 610.6
    four_player_mean_legal_actions: 42.5
  training_targets:
    competitive_anchor_states: 8000000
    competitive_completed_terminal_simulations: 64000000
    competitive_branch_environment_plies_approx: 16544000000
    competitive_learner_updates_approx: 62500
    champion_anchor_states_min: 25600000
    champion_anchor_states_max: 76800000
    champion_completed_terminal_simulations_min: 204800000
    champion_completed_terminal_simulations_max: 614400000
    champion_branch_environment_plies_min_approx: 52940000000
    champion_branch_environment_plies_max_approx: 158800000000
    champion_learner_updates_min: 200000
    champion_learner_updates_max: 600000
  base_game_diversity_per_update:
    bootstrap_min: 32
    main_min: 64
  actor_requirements:
    use_kv_cache: implemented_contiguous_sdpa_incremental
    share_branch_prefix_copy_on_write: implemented_persistent_history_and_bounded_prefix_lru
    update_every_observer_view: true
  memory_optimizations:
    bfloat16: true
    fused_scaled_dot_product_attention: true
    activation_checkpointing: true
    board_history_time_chunking: true
    deduplicate_overlapping_board_snapshots_per_update: true
    packed_board_rows: true
    learner_history_length_bucketing: true
    rollout_anchor_wave_size: 8
    temporal_prefix_cache_entries_per_rank: 192
