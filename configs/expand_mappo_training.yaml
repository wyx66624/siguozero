  next_policy_temporal_layers: 16
  next_policy_temporal_d_model: 512
  next_policy_temporal_ffn_dim: 2048
historical_opponents:
  enabled: true
  # Optional opponent mode, OFF: live champion + public tactical hard rules.
  # When enabled, replaces the sampled historical opponent, using the same
  # start_fraction/training_fraction. Learner and teammate remain unmodified.
  tactical_champion: false
  # One additional adaptive pool identity, refreshed from the learner each rollout.
  # Shares the normal loss-rate prior/EMA/softmax with ordinary historical versions.
  tactical_current: true
  start_fraction: 0.3333333333333333  # 1B of the 3B environment-step budget.
  # After activation: 80% current self-play, 20% historical pool (including tactical).
  training_fraction: 0.2
  teammate_fraction: 0.0
  snapshot_fractions: [0.016666666666666666, 0.03333333333333333, 0.05]
  # Every saved version from 50M remains eligible; cache limits never prune it.
  checkpoint_start_fraction: 0.016666666666666666
  sampling: strength
  initial_loss_rate: 0.5
  win_rate_temperature: 0.10  # Softmax of learner loss-rate EMA; draws excluded.
  win_rate_ema_alpha: 0.01
  stage_mix_fraction: 0.0
  cache_gib: 32
  cache_reserve_gib: 16
  pinned_mib: 256
  cohort_games: 1024
  eval_total_games: 500  # Total across the frozen panel, allocated in four-game rotations.
  uniform_fraction: 0.0
  learning_rate: 0.01
  mode_overrides:
    two_player:
      # Only frozen historical opponents; no teammates or tactical pool member.
      tactical_current: false
      tactical_champion: false
      start_fraction: 0.16666666666666666  # 500M of the shared 3B step budget.
      start_environment_plies: 500000000  # Fixed threshold even if the budget changes.
      teammate_fraction: 0.0
      checkpoint_start_fraction: 0.008333333333333333  # Include every 25M version.

