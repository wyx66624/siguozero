      architecture: coordinates_player_linear
      input_dim: 5
      output_dim: 256
      coordinate_system: viewer_relative_board_wide_cartesian
      normalization: none
      linear_layers: 1
      learned_field_embeddings: false
      layer_norm: false
      fields:
